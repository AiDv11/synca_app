name: synca_app
description: "Coordinate university group projects: plan, assign and track coursework tasks."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: ^3.12.0

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  firebase_core: ^4.12.1
  firebase_auth: ^6.5.6
  cloud_firestore: ^6.7.1
  url_launcher: ^6.3.2

  # A build-time tool like flutter_launcher_icons below, but it sits here rather
  # than in dev_dependencies because main.dart imports it: the web splash is
  # plain HTML in web/index.html, and the only thing that ever takes it back off
  # the page is FlutterNativeSplash.remove() called from Dart. A package
  # imported from lib/ has to be a real dependency — as a dev dependency the
  # `depend_on_referenced_packages` lint fires and a release build cannot count
  # on it being there.
  flutter_native_splash: ^2.4.8

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0
  # A build-time tool, not a library the app imports. It reads the config block
  # below, writes real icon files into android/, ios/ and web/, and is never
  # part of the shipped app — which is why it sits here rather than under
  # dependencies. (flutter_native_splash is the exception, and says why.)
  #
  # Neither generator runs on its own. After changing either config below:
  #   dart run flutter_launcher_icons
  #   dart run flutter_native_splash:create
  flutter_launcher_icons: ^0.14.4

# =============================================================================
# App icon — generated by flutter_launcher_icons
# =============================================================================
#
# Two source images, because Android asks a different question from everyone
# else.
#
# iOS and web want one finished square: the mark on navy, edge to edge, and the
# platform rounds the corners itself. That is `assets/branding/icon.png` exactly
# as drawn.
#
# Android 8 and later use *adaptive* icons — a separate background and
# foreground layer, which the launcher masks into whatever shape it likes
# (circle, squircle, teardrop) and shifts around for parallax. Only the middle
# ~66% of the layer is guaranteed to survive that. The mark fills about 88% of
# the source square, so feeding icon.png in directly would slice the outer ring
# and the three dots off. `icon_padded.png` is the same artwork scaled into that
# safe zone, generated from the same file.
flutter_launcher_icons:
  image_path: "assets/branding/icon.png"

  android: true
  # The layers of the adaptive icon. Background is a flat colour rather than an
  # image — the artwork already carries navy, so a solid navy layer means the
  # seam between the two is invisible no matter how the launcher masks it.
  adaptive_icon_background: "#0D1B3D"
  adaptive_icon_foreground: "assets/branding/icon_padded.png"
  # The tool insets the foreground by 16% of its own accord. The padded source
  # is already sized for the safe zone, and the two paddings compound — left at
  # the default the mark lands at about 45% of the icon and looks lost inside
  # it. Zero here means the padding baked into the image is the only padding.
  adaptive_icon_foreground_inset: 0

  ios: true
  # iOS rejects an icon with an alpha channel outright. The source is RGBA, so
  # this flattens it — against the navy it already sits on, so nothing changes
  # visually.
  remove_alpha_ios: true

  web:
    generate: true
    image_path: "assets/branding/icon.png"

# =============================================================================
# Splash screen — generated by flutter_native_splash
# =============================================================================
#
# Shown by the OS between tapping the launcher and Flutter's first frame. On a
# cold start that gap also covers `Firebase.initializeApp`, so it is not
# instant and it is worth looking deliberate.
#
# Navy background with the mark centred, so it reads as one continuous screen
# with the icon that was just tapped.
flutter_native_splash:
  color: "#0D1B3D"

  # The padded variant again, and for the same reason on Android 12+: that
  # version draws the splash icon inside a circle and crops everything outside
  # it. Using one image across all versions also keeps the mark the same size
  # whichever splash a device happens to show.
  image: assets/branding/icon_padded.png

  android: true
  ios: true
  web: true

  # Android 12 replaced the old full-screen splash with a system-drawn one that
  # has to be configured separately — the keys above are ignored there.
  android_12:
    image: assets/branding/icon_padded.png
    icon_background_color: "#0D1B3D"

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
